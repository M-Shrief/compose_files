networks:
  forgejo:
    external: false

services:
  server:
    image: codeberg.org/forgejo/forgejo:14.0.2
    # image: data.forgejo.org/forgejo/forgejo:14.0.2
    container_name: forgejo
    environment:
      - USER_UID=1000
      - USER_GID=1000
      - FORGEJO__database__DB_TYPE=postgres
      - FORGEJO__database__HOST=db:5432
      - FORGEJO__database__NAME=forgejo
      - FORGEJO__database__USER=forgejo
      - FORGEJO__database__PASSWD=forgejo
    restart: unless-stopped
    networks:
      - forgejo
    volumes:
      - ./data:/data
      - /etc/timezone:/etc/timezone:ro
      - /etc/localtime:/etc/localtime:ro
    ports:
      - "3000:3000"
      - "3001:22" # make sure you specify the port in git remote urls, like: ssh://git@localhost:222/user/repo.git
    depends_on:
      - db

  db:
    image: docker.io/library/postgres:17.5-bullseye
    restart: unless-stopped
    environment:
      - POSTGRES_USER=forgejo
      - POSTGRES_PASSWORD=forgejo
      - POSTGRES_DB=forgejo
    networks:
      - forgejo
    volumes:
      - ./postgres:/var/lib/postgresql/data
